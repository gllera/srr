version: "2"

# golangci defaults to max-issues-per-linter: 50 and max-same-issues: 3, which
# silently TRUNCATE the report. That is reasonable for a codebase being brought
# under a linter and actively wrong for one that gates at zero: this repo's
# lint-be must stay clean, so every hidden issue is work that looks done. It
# also makes triage lie — enabling bodyclose surfaced exactly 3 identical
# findings, the cap, and errorlint's 4th `!=` comparison only appeared after the
# first three were fixed. Unlimited (0) is the only honest setting here.
issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  # Beyond the v2 default set (errcheck/govet/ineffassign/staticcheck/unused),
  # which covers none of the classes that actually bite a long-running fetcher.
  # Each was enabled alone, its every finding read, and the residue either fixed
  # or suppressed at the narrowest scope that works — see the rules below and
  # the site comments they point at (TST7).
  enable:
    # A leaked resp.Body in a 24/7 five-minute loop is an unbounded connection
    # leak. It cannot see through store/http.go's drainClose helper (it matches
    # a literal Close on the body value), so those three sites are suppressed
    # in place; every other HTTP call site in the tree passed unaided.
    - bodyclose
    # The store layer dispatches on sentinels (os.ErrExist for lock contention,
    # store.ErrPreconditionFailed for a lost root CAS, errors.ErrUnsupported for
    # a backend declining a verb), and a `==` where errors.Is belongs silently
    # unclassifies a wrapped one. Every surviving `==` is a test asserting an
    # error propagates by IDENTITY, suppressed at the site — errors.Is there
    # would accept exactly the wrapping the test exists to rule out.
    - errorlint
    # The fetch loop must die on SIGTERM mid-cycle, so a request that cannot be
    # cancelled is a hung deploy. The two production sites left context-less are
    # a local unix-socket dial and an interactive editor, both suppressed at the
    # site; tests are excluded wholesale below.
    - noctx
    # This binary shells out to operator-configured commands, parses hostile
    # HTML and writes a store, so the exec/TLS/host-key rules earn their keep.
    # Seven rules, in four groups, are switched off below — not as risk
    # acceptance, but because each group is answering a question this codebase
    # answers somewhere else. Each group states where.
    - gosec
    # Expected to be the noisy one and was not: 3 findings on the default check
    # set, none of them a defect, and no check needed disabling. Two were
    # `x = append(y, …)` — the shape that hides a backing-array aliasing bug,
    # benign at both sites and rewritten to say so — and one was a test's
    # deliberately padded map key. Left at the default groups (style +
    # diagnostics); the opinionated/performance tags are a separate decision.
    - gocritic

  settings:
    gosec:
      # Triage of the full 322-finding run, rule by rule. Everything not listed
      # here stayed ON and its findings are suppressed at the site.
      excludes:
        # G104 "errors unhandled" (166 findings) — errcheck, already enabled,
        # is the same check with a curated policy behind it: the
        # std-error-handling preset and the tests rule below. gosec honours
        # neither, so keeping both means every unchecked-return decision has to
        # be made twice, in two syntaxes, and the second copy has no way to say
        # "deferred Close is fine". Duplication, not coverage.
        - G104
        # G115 "integer overflow conversion" (33) — the idx/seen/meta formats
        # ARE fixed-width binary, so every narrowing here is the encoding, not
        # a bug: feed_id is a u16 by contract and feedIDCeiling is enforced at
        # allocation (db.go), on the CLI (db.go), and at load (root.go); idx
        # boundaries are local indices under a 50,000 stride; the seen day
        # stamp is unix-days, which reaches u16 in 2149; and db_meta's
        # uint32(sum), uint32(sum>>32) IS the FNV-1a-64 double-hash split,
        # mirrored byte-for-byte in TypeScript by the data contract. Each of
        # the 18 production sites was read against its bound. The format's real
        # guards are elsewhere and stronger: FuzzParseIdxPack, FuzzIdxWriteParse
        # and `srr inspect --validate`.
        - G115
        # G301/G302/G306 "directory/file permissions" (12 + 1 + 46) — gosec
        # wants 0750 and 0600. Both are actively wrong here: a local store is a
        # directory tree a static web server reads (store/local.go, including
        # the AtomicPut staging file that gets renamed INTO that tree), and
        # cmd_gents.go writes a checked-in TypeScript source file the frontend
        # build must read. The rest is tests writing fixtures.
        - G301
        - G302
        - G306
        # G304 "file inclusion via variable" (50) and its taint-analysis
        # sibling G703 "path traversal" (7) — this is a CLI whose job is opening
        # paths the operator named: --store, $SRR_CONFIG, the OPML argument, the
        # edit tempfile, the local backend's own keys, a test fixture dir from
        # $SRR_GENEXPIRE_OUT. The one path that IS attacker-influenced — an
        # ingest command's asset marker — is guarded before the open by Lstat +
        # EvalSymlinks + filepath.Rel containment in assets.go, which gosec
        # cannot model and which has its own tests; note it did not flag that
        # site under either rule. A check that cannot tell operator input from
        # feed input flags the whole program and ranks them the same.
        - G304
        - G703

  exclusions:
    # Idiomatic ignore-on-cleanup calls (deferred Close, Flush, os.Remove,
    # fmt.Fprint* to buffered/terminal sinks) — the stdlib error-handling set.
    presets:
      - std-error-handling
    rules:
      # Tests fail loudly on their own; unchecked cleanup returns are noise.
      - path: _test\.go
        linters:
          - errcheck
      # httptest.NewRequest against an in-process handler, and http.Post/Get
      # against an httptest.Server, are the shape of every serve/mcp handler
      # test here (17 sites across 4 files, and every new handler adds more).
      # None of them talks to a network that can hang, and a test that wedges
      # anyway is bounded by `go test`'s own timeout. Config-level rather than
      # per-site because the pattern is the test suite's, not one call's.
      - path: _test\.go
        linters:
          - noctx
      # SA5011 false positive on the `if x == nil { t.Fatal } → deref` pattern
      # (staticcheck fails to model t.Fatal as no-return here). Config-level
      # because a site //nolint can't cover it: golangci also emits the
      # "related information" diagnostic at the nil-CHECK line as its own issue.
      - path: _test\.go
        text: "SA5011"
        linters:
          - staticcheck
