# Copy to wrangler.toml (gitignored) and fill in your own route and zone.
# `make verify-cloud` / `make smoke-cloud` materialize it from this file
# automatically when it is missing, so a fresh clone tests without any setup;
# `make deploy-cloud` refuses to ship a config that still says example.com.
#
# Everything below the placeholders is real configuration, not decoration:
#
# run_worker_first is deliberate: EVERY request goes through the Worker, so the
# assets layer can never serve index.html (or anything) around the auth gate.
# html_handling "none" keeps ASSETS.fetch exact-path (no directory-index
# rewrites).
name = "srr-cloud"
main = "src/index.ts"
# Matches the workerd the pinned vitest pool ships (newer dates fall back noisily).
compatibility_date = "2025-10-11"
workers_dev = false

# Your hostname and its Cloudflare zone. The route is inert until an
# operator-initiated `make deploy-cloud`.
routes = [{ pattern = "cloud.example.com/*", zone_name = "example.com" }]

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "none"
run_worker_first = true

[[r2_buckets]]
binding = "STORE"
bucket_name = "srr-cloud"

# NO [vars] block, and that is the whole configuration story now: this Worker
# signs users in itself (src/oidc.ts), so there is no login URL to point at.
#
# Everything it needs at runtime — OIDC_ISSUER, OIDC_CLIENT_ID,
# OIDC_CLIENT_SECRET, SESSION_HMAC_SECRET, ROSTER — is `wrangler secret put …`
# in production and .dev.vars locally. Two of the five are not secret in the
# OIDC sense (a client_id is published in every authorization request); they are
# secrets here because they NAME THE DEPLOYMENT, which is the thing this public
# repo does not carry. The roster is a secret because it is personal data.
# src/index.ts 500s rather than half-works when one of the four is unset.
#
# See .dev.vars.example.
