name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Deliberately ONE job, not a frontend/backend split — measured 2026-07-26,
  # don't re-litigate without new numbers.
  #
  # Wall time is set by the slowest job, and that is `race`, not this one
  # (16-core warm local: race 110s, verify 53s = verify-fe 13s + verify-be 33s +
  # test-contract 7s, browser ~45s). -race is effectively single-threaded and
  # barely uses the extra cores, while verify runs at 4-6x parallelism and so
  # loses MORE than race does on a 4-vCPU runner — which only widens the gap.
  # Splitting verify therefore buys no wall time at all: the critical path stays
  # race either way.
  #
  # It is not free, either. A second job pays another checkout + setup-toolchain
  # (~40s of billable compute), and test-contract needs Go AND Node, so it
  # cannot ride the frontend job — the backend job keeps it and remains the
  # longer half, leaving a ~13s frontend job idling next to it.
  #
  # The one genuine gain is signal: verify's targets run serially, so a red
  # verify-fe currently hides verify-be. That was judged not to be worth a
  # permanent extra job for a two-project repo where the backend already has two
  # jobs of its own (race, and browser builds the binary too). Revisit if verify
  # ever overtakes race — TST4/TST6-scale additions are the plausible trigger.
  # (The nightly chaos job landing separately runs on its own schedule and never
  # sits on the push/PR critical path, so it does not change this arithmetic.)
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-toolchain
    - run: make verify

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v6
    # Needs Go (test-browser builds the srr binary) but never lints.
    - uses: ./.github/actions/setup-toolchain
      with:
        lint: "false"
    # Chrome is downloaded by puppeteer's postinstall during npm ci; restoring
    # the cache first lets it skip the download on a hit.
    - name: Cache Puppeteer Chrome
      uses: actions/cache@v4
      with:
        path: ~/.cache/puppeteer
        key: puppeteer-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
        restore-keys: |
          puppeteer-${{ runner.os }}-
    - run: make test-browser

  # The coverage RATCHET (TST8): re-runs the backend suite instrumented and
  # fails when any area in scripts/coverage-floors.tsv drops below its floor.
  #
  # Its own job for the reason the split above was REJECTED, applied in reverse:
  # the critical path is `race` (~110s), and an instrumented backend run is well
  # under that, so this job is free wall-clock — where folding it into `verify`
  # would have made the shortest job longer for no gain. Go only: cover-be runs
  # `go test ./...` directly, which compiles against the committed placeholder
  # backend/webui/dist, so it needs neither Node nor golangci.
  #
  # The actual-vs-floor delta table is echoed into the job summary as well as
  # the log, so a drift shows on the run's front page rather than only to
  # whoever expands the step.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-toolchain
      with:
        node: "false"
        lint: "false"
    - name: Coverage ratchet
      run: |
        set -o pipefail
        make cover-be 2>&1 | tee cover.log
    # Runs on failure too — a shortfall is exactly when the table is worth
    # reading, and the step above has already printed it.
    - name: Publish coverage table
      if: always()
      run: |
        {
          echo '### Backend coverage'
          echo '```'
          sed -n '/^area /,$p' cover.log || true
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

  # The concurrency gate, its own job because -race is ~2-5x slower than the
  # plain suite and verify must stay fast. -shuffle=on is half the value: it
  # catches tests that only pass in declaration order (it found a shared-fixture
  # leak in the ingest stub the first time it ran).
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v6
    # Go only — test-race-be has no frontend prerequisite and never lints.
    - uses: ./.github/actions/setup-toolchain
      with:
        node: "false"
        lint: "false"
    - run: make test-race-be
