name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

# Serialize the Cloudflare deploys (Pages, and the reader Worker) so overlapping
# tag pushes don't race to publish; let an in-flight deploy finish rather than
# cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Gate every release artifact on a green `make verify` (lint + format + tests +
  # build + the boot smoke + the e2e contract layer). Without this, a tag push
  # publishes binaries and deploys the frontend to Pages without the build ever
  # passing its own gates — exactly how a frontend that fails its tests (or a
  # bundle that doesn't boot) could reach production.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-toolchain
    - run: make verify

  # The browser e2e layer is NOT part of `make verify` (see the Makefile), and
  # ci.yml has no `tags:` trigger — so without this job a tag push deploys the
  # production reader with the browser layer red or never run. Mirrors ci.yml's
  # `browser` job.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v6
    # Needs Go (test-browser builds the srr binary) but never lints.
    - uses: ./.github/actions/setup-toolchain
      with:
        lint: "false"
    # Chrome is downloaded by puppeteer's postinstall during npm ci; restoring
    # the cache first lets it skip the download on a hit.
    - name: Cache Puppeteer Chrome
      uses: actions/cache@v4
      with:
        path: ~/.cache/puppeteer
        key: puppeteer-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
        restore-keys: |
          puppeteer-${{ runner.os }}-
    - run: make test-browser

  release:
    if: github.event_name == 'push'
    needs: [verify, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ github.ref_name }}
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-toolchain
    - run: make release
    # Bundle the built SPA as a flat tarball (entries are index.html, hashed
    # assets — no leading dir) so `srr frontend update` can install it into a
    # store root. Built with NO cdn-url (deliberately no SRR_CONFIG_INLINE here),
    # so resolve-cdn-url.js falls back to "." — the shell fetches packs relative
    # to its own index.html and is origin-portable: it renders from whatever
    # store root it's installed into. (The `cf-pages` job below keeps the absolute
    # cdn-url; there the hosted reader and the packs live on different origins.)
    - run: make build-fe
    - run: tar czf srrf.tar.gz -C dist/srrf .
    - uses: softprops/action-gh-release@v3
      with:
        files: |
          dist/srr-*
          srrf.tar.gz

  cf-pages:
    needs: [verify, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ci
    env:
      # Build WITH the absolute cdn-url so PACK_BASE is the pack store origin:
      # this Cloudflare Pages deployment is the reader ONLY and fetches packs
      # cross-origin. SRR_CDN_URL is the highest-precedence cdn-url source in
      # resolve-cdn-url.js (env → config `cdn-url:` → "."). (The srrf.tar.gz
      # Release asset is built with NO cdn-url for same-origin self-hosting —
      # don't deploy that one here, it would 404 on db.gz against the Pages
      # origin.)
      SRR_CDN_URL: ${{ secrets.SRR_CDN_URL }}
      # The build's version label (config footer / transformer-define.js's
      # SRR_VERSION): the tag on tag builds, the branch name on manual dispatch.
      VERSION: ${{ github.ref_name }}
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-toolchain
      with:
        go: "false"
    - run: make build-fe
    # Direct Upload the built SPA (dist/srrf) to Cloudflare Pages. --branch=main
    # marks it a production deploy — it must equal the project's configured
    # production branch, and tag pushes carry no branch context so it's passed
    # explicitly. Needs repo/ci-environment secrets CLOUDFLARE_API_TOKEN (token
    # scoped to Account → Cloudflare Pages → Edit) and CLOUDFLARE_ACCOUNT_ID.
    - uses: cloudflare/wrangler-action@v4
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        command: pages deploy dist/srrf --project-name=srr-frontend --branch=main

  # The hosted reader as a Worker that both GATES the reader (OIDC against the
  # estate's IdP) and SERVES it — cloud/worker/src/reader.ts. It replaces
  # cf-pages above rather than joining it: a static origin behind a gate has a
  # documented way around the gate, which is the second address the same bytes
  # answer at.
  #
  # ⚠ BOTH JOBS RUN DURING THE CUTOVER, deliberately. Until the reader's
  # hostname is moved off the Pages project, that project IS the live reader and
  # deleting this job would freeze it at whatever version was last tagged. The
  # order is: this job deploys the Worker → the operator moves the hostname →
  # cf-pages and its project are deleted. Delete this comment with it.
  #
  # Needs, in the `ci` environment: SRR_WORKER_ROUTE (the route pattern, e.g.
  # `reader.example.com/*` — the one piece of deployment identity this public
  # repo does not carry), plus CLOUDFLARE_API_TOKEN widened from Pages:Edit to
  # ALSO carry Account → Workers Scripts:Edit and Zone → Workers Routes:Edit +
  # Zone:Read (the zone is inferred from the route's hostname). The Worker's own
  # four runtime values are `wrangler secret put`, set once by the operator and
  # untouched by a deploy — CI never sees them.
  deploy-reader:
    needs: [verify, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ci
    env:
      SRR_CDN_URL: ${{ secrets.SRR_CDN_URL }}
      SRR_WORKER_ROUTE: ${{ secrets.SRR_WORKER_ROUTE }}
      VERSION: ${{ github.ref_name }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-toolchain
      with:
        go: "false"
    # The `secrets` context is not available in a job-level `if`, so the skip is
    # a step that PRINTS why. It is loud on purpose: a deploy that quietly does
    # nothing is how a release silently stops shipping. Once SRR_WORKER_ROUTE
    # exists this job starts deploying on the next tag with no edit here.
    - name: Check the reader Worker is configured
      id: configured
      run: |
        if [ -z "$SRR_WORKER_ROUTE" ]; then
          echo "SRR_WORKER_ROUTE is unset — the reader Worker is not deployed by CI yet."
          echo "Set it in the ci environment once the Worker owns the reader's hostname."
          echo "ready=false" >> "$GITHUB_OUTPUT"
        else
          echo "ready=true" >> "$GITHUB_OUTPUT"
        fi
    - if: steps.configured.outputs.ready == 'true'
      run: make deploy-reader
