name: Chaos

# Nightly, not per-push, for the same reason as Fuzz: a seeded random walk is a
# SEARCH, not a check. Most runs find nothing, so gating a PR on wall-clock it
# may spend for no signal is the wrong trade — while a nightly with a real seed
# budget covers the combinatorics no curated fixture does (the pack<->delta seam
# x expiration x feed churn with id reuse x GC keep-window x compaction x
# process restarts). Every seed is PRINTED, and a failing run's store is
# uploaded with the one-line repro beside it.
#
# 04:41 deliberately clears fuzz.yml's 03:17: the two jobs are independent but
# they read the same repo cache and there is no reason to have them contend.
on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
    inputs:
      seeds:
        description: "Seeds to walk"
        required: false
        default: "32"
      articles:
        description: "Article budget per seed"
        required: false
        default: "900"
      seed:
        description: "Replay exactly this seed (overrides `seeds`)"
        required: false
        default: ""

concurrency:
  group: chaos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The writer half: backend/chaos_test.go drives the real production write path
  # and asserts inspect --validate, chron permanence against an independent
  # oracle, every live chron's payload, and consolidation equivalence against
  # the --max-deltas=0 kill switch.
  writer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      # Go only — the driver is a Go test with no frontend prerequisite, and it
      # never lints.
      - uses: ./.github/actions/setup-toolchain
        with:
          node: "false"
          lint: "false"
      - name: Walk the seeds
        run: |
          make chaos-be \
            CHAOS_SEEDS='${{ inputs.seeds || '32' }}' \
            CHAOS_ARTICLES='${{ inputs.articles || '900' }}' \
            CHAOS_SEED='${{ inputs.seed }}' \
            CHAOS_OUT="$PWD/chaos-store"
      # The driver stops at the FIRST failing seed and leaves that seed's store
      # in CHAOS_OUT with a chaos-repro.sh beside db.gz, so the artifact is both
      # the evidence and the instructions for reproducing it. A 900-article
      # store is well under a megabyte.
      - name: Upload the failing seed's store
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-store
          path: chaos-store
          if-no-files-found: ignore

  # The reader half: frontend/e2e/contract/chaos.e2e.test.ts points the real
  # data layer at a chaos store and reads every live chron, comparing against
  # the writer's own oracle rather than against the store's idx. It is gated on
  # SRR_CHAOS, so the rest of the contract layer runs exactly as it does on
  # every push and only the chaos file is extra.
  reader:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      # Needs Go (test-contract builds the srr binary, and the chaos fixture is
      # generated by a Go test) but never lints.
      - uses: ./.github/actions/setup-toolchain
        with:
          lint: "false"
      - run: make test-contract
        env:
          SRR_CHAOS: "1"
          SRR_CHAOS_ARTICLES: ${{ inputs.articles || '400' }}
          SRR_CHAOS_SEED: ${{ inputs.seed }}
