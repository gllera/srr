name: Setup toolchain
description: >
  Set up the SRR monorepo toolchain (Go and/or Node) with dependency caching.
  Single-sources the versions: Go from backend/go.mod, Node from .nvmrc.
inputs:
  go:
    description: Set up Go (backend toolchain).
    default: "true"
  node:
    description: Set up Node (frontend toolchain).
    default: "true"
  lint:
    description: >
      Install golangci-lint (needed by any job running make verify /
      verify-be / release). Off for jobs that build but never lint.
    default: "true"
  golangci-version:
    description: >
      The pinned golangci-lint release, single-sourced here: it is the install
      script ref, the installed binary version AND the cache key, which used to
      be three copies of the same string. Must stay compatible with
      backend/.golangci.yml's schema (version: "2") — bump both together.
    default: "v2.12.2"
runs:
  using: composite
  steps:
    - if: inputs.go == 'true'
      uses: actions/setup-go@v6
      with:
        go-version-file: backend/go.mod
        cache-dependency-path: backend/go.sum
    # make verify runs golangci-lint (lint-be gates verify-be). The version is
    # pinned to the release backend/.golangci.yml targets (version: "2" schema)
    # — an unpinned HEAD script is a moving curl-pipe-sh target.
    #
    # Cached because the install is a ~39 MB binary pulled over two external
    # hops (raw.githubusercontent.com for the script, then the GitHub release
    # asset) on every lint-running job. The time saved is modest; not depending
    # on two third-party endpoints staying up to run CI is the real win.
    #
    # No restore-keys, deliberately: a partial-key hit would restore the WRONG
    # golangci version and then skip the install that would have corrected it,
    # so the pin has to be exact or miss.
    - if: inputs.go == 'true' && inputs.lint == 'true'
      id: golangci-cache
      uses: actions/cache@v4
      with:
        path: ~/.local/bin/golangci-lint
        key: golangci-lint-${{ runner.os }}-${{ runner.arch }}-${{ inputs.golangci-version }}
    - if: inputs.go == 'true' && inputs.lint == 'true' && steps.golangci-cache.outputs.cache-hit != 'true'
      name: Install golangci-lint
      shell: bash
      run: |
        curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/${{ inputs.golangci-version }}/install.sh \
          | sh -s -- -b "$HOME/.local/bin" ${{ inputs.golangci-version }}
    # PATH is set on hit and miss alike — the cache restores the binary but not
    # the environment the install step would have exported.
    - if: inputs.go == 'true' && inputs.lint == 'true'
      name: Put golangci-lint on PATH
      shell: bash
      run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - if: inputs.node == 'true'
      uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
